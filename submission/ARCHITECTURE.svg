<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" style="background:#0b0f1a">
  <defs>
    <style>
      .bg-card { fill:#161b2c; stroke:#00a3ff; stroke-width:1.5; rx:8; ry:8; }
      .bg-panel { fill:#0f1420; stroke:#ffffff22; stroke-width:1; rx:6; ry:6; }
      .accent-stroke { stroke:#00a3ff; stroke-width:2; fill:none; }
      .accent-fill { fill:#00a3ff; }
      .text-main { fill:#ffffff; font-family:'Segoe UI',Arial,sans-serif; font-weight:600; }
      .text-muted { fill:#a0aec0; font-family:'Segoe UI',Arial,sans-serif; font-weight:400; }
      .label { fill:#a0aec0; font-family:'Segoe UI',Arial,sans-serif; font-size:13px; }
      .title { fill:#ffffff; font-family:'Segoe UI',Arial,sans-serif; font-weight:700;}
      .arrow { stroke:#00a3ff; stroke-width:2; marker-end:url(#arrowhead); }
      .cloud { fill:#1a202c; stroke:#4a5568; stroke-width:1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00a3ff"/>
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="20" width="840" height="100" class="bg-card"/>
  <text x="60" y="55" class="title" font-size="24">QuantumShield Cryptographic Intelligence Pipeline</text>
  <text x="60" y="80" class="label">Discovery · Normalization · Classification · Risk · Remediation · Evidence</text>

  <!-- User + UI Layer -->
  <rect x="360" y="140" width="180" height="50" class="bg-card"/>
  <text x="450" y="170" text-anchor="middle" class="title" font-size="14">Security Engineer</text>

  <rect x="345" y="200" width="210" height="60" class="bg-panel"/>
  <text x="450" y="235" text-anchor="middle" class="label" font-size="12">QuantumShield Web UI</text>
  <text x="450" y="252" text-anchor="middle" class="label" font-size="11">React + TypeScript + Vite</text>
  <text x="450" y="268" text-anchor="middle" class="label" font-size="10">tailwind UI</text>

  <!-- Cloud boundary -->
  <rect x="300" y="60" width="300" height="250" class="cloud"/>
  <text x="450" y="60" text-anchor="middle" class="label" font-size="11">Vercel Frontend CDN</text>

  <!-- Arrow from UI to API -->
  <line x1="450" y1="260" x2="450" y2="280" class="arrow"/>

  <!-- Backend API -->
  <rect x="260" y="285" width="380" height="60" class="bg-panel"/>
  <text x="450" y="320" text-anchor="middle" class="label" font-size="12">FastAPI Backend</text>
  <text x="450" y="338" text-anchor="middle" class="label" font-size="11">Uvicorn ASGI · Port 8000</text>

  <!-- Render boundary -->
  <rect x="255" y="280" width="390" height="75" class="cloud"/>
  <text x="450" y="278" text-anchor="middle" class="label" font-size="11">Render (Render Backend)</text>

  <!-- Arrow to scanners -->
  <line x1="450" y1="350" x2="450" y2="370" class="arrow"/>

  <!-- Scanners section -->
  <rect x="50" y="375" width="800" height="120" class="bg-panel"/>
  <text x="450" y="395" text-anchor="middle" class="title" font-size="14">Offline Discovery & Scanners</text>

  <!-- Scanner boxes -->
  <rect x="80" y="410" width="110" height="75" class="bg-card"/>
  <text x="135" y="440" text-anchor="middle" class="label" font-size="11">Source</text>
  <text x="135" y="458" text-anchor="middle" class="label" font-size="10">(AST + Regex)</text>

  <rect x="240" y="410" width="110" height="75" class="bg-card"/>
  <text x="295" y="440" text-anchor="middle" class="label" font-size="11">Dependency</text>
  <text x="295" y="458" text-anchor="middle" class="label" font-size="10">Manifests</text>

  <rect x="400" y="410" width="110" height="75" class="bg-card"/>
  <text x="455" y="440" text-anchor="middle" class="label" font-size="11">Certificates</text>
  <text x="455" y="458" text-anchor="middle" class="label" font-size="10">(.pem, .der, .p12)</text>

  <rect x="560" y="410" width="110" height="75" class="bg-card"/>
  <text x="615" y="440" text-anchor="middle" class="label" font-size="11">Keystores</text>
  <text x="615" y="458" text-anchor="middle" class="label" font-size="10">(.p12, .pub)</text>

  <rect x="720" y="410" width="110" height="75" class="bg-card"/>
  <text x="775" y="440" text-anchor="middle" class="label" font-size="11">Config / JVM</text>
  <text x="775" y="458" text-anchor="middle" class="label" font-size="10">(.conf, .class)</text>

  <!-- Arrow down -->
  <line x1="450" y1="500" x2="450" y2="520" class="arrow"/>

  <!-- Processing Pipeline -->
  <rect x="150" y="525" width="600" height="540" class="bg-panel"/>

  <!-- Pipeline steps -->
  <rect x="200" y="545" width="500" height="75" class="bg-card"/>
  <text x="450" y="580" text-anchor="middle" class="title" font-size="13">Evidence Normalization</text>
  <text x="450" y="598" text-anchor="middle" class="label" font-size="11">File • Line • Snippet • Confidence</text>

  <line x1="450" y1="620" x2="450" y2="635" class="arrow"/>

  <rect x="200" y="640" width="500" height="75" class="bg-card"/>
  <text x="450" y="675" text-anchor="middle" class="title" font-size="13">Cross-Scanner Deduplication</text>
  <text x="450" y="693" text-anchor="middle" class="label" font-size="11">NormPath • Line • Algorithm • Usage</text>

  <line x1="450" y1="715" x2="450" y2="730" class="arrow"/>

  <rect x="200" y="735" width="500" height="75" class="bg-card"/>
  <text x="450" y="770" text-anchor="middle" class="title" font-size="13">Cryptographic Classification</text>
  <text x="450" y="788" text-anchor="middle" class="label" font-size="11">Shor-broken • Grover-weakened • Legacy-broken • Quantum-safe</text>

  <line x1="450" y1="810" x2="450" y2="825" class="arrow"/>

  <rect x="200" y="830" width="500" height="75" class="bg-card"/>
  <text x="450" y="865" text-anchor="middle" class="title" font-size="13">Threat Surface Tagging</text>
  <text x="450" y="883" text-anchor="middle" class="label" font-size="11">HNDL (Confidentiality) • TNFL (Authenticity)</text>

  <line x1="450" y1="905" x2="450" y2="920" class="arrow"/>

  <rect x="200" y="925" width="500" height="75" class="bg-card"/>
  <text x="450" y="960" text-anchor="middle" class="title" font-size="13">Quantum Risk Modeling</text>
  <text x="450" y="978" text-anchor="middle" class="label" font-size="11">Mosca Inequality: X + Y &gt; Z</text>
  <text x="450" y="995" text-anchor="middle" class="label" font-size="11">5-Factor Deterministic Risk: 0-100, Banded</text>

  <line x1="450" y1="1000" x2="450" y2="1015" class="arrow"/>

  <rect x="200" y="1020" width="500" height="75" class="bg-card"/>
  <text x="450" y="1055" text-anchor="middle" class="title" font-size="13">PQC Remediation &amp; Recommendations</text>
  <text x="450" y="1073" text-anchor="middle" class="label" font-size="11">FIPS 203 (ML-KEM) • FIPS 204 (ML-DSA) • FIPS 205 (SLH-DSA)</text>

  <line x1="450" y1="1095" x2="450" y2="1110" class="arrow"/>

  <!-- Outputs -->
  <rect x="150" y="1115" width="600" height="70" class="bg-card"/>
  <text x="450" y="1145" text-anchor="middle" class="title" font-size="13">Standards-Based Evidence Outputs</text>
  <text x="450" y="1163" text-anchor="middle" class="label" font-size="11">CycloneDX 1.6 CBOM • SARIF 2.1.0 • HTML/PDF/CSV/Markdown Reports</text>

  <!-- Security Boundaries -->
  <rect x="20" y="1120" width="90" height="65" rx="5" style="fill:none;stroke:#00c853;stroke-width:2;stroke-dasharray:4 2"/>
  <text x="65" y="1145" text-anchor="middle" class="label" font-size="10" fill="#00c853">Temporary</text>
  <text x="65" y="1160" text-anchor="middle" class="label" font-size="10" fill="#00c853">Scan Workspace</text>
  <text x="65" y="1173" text-anchor="middle" class="label" font-size="10" fill="#00c853">Deleted after run</text>

  <rect x="800" y="1120" width="70" height="65" rx="5" style="fill:none;stroke:#ff4d4d;stroke-width:2;stroke-dasharray:4 2"/>
  <text x="835" y="1145" text-anchor="middle" class="label" font-size="10" fill="#ff4d4d">No Private</text>
  <text x="835" y="1160" text-anchor="middle" class="label" font-size="10" fill="#ff4d4d">Key Persistence</text>
  <text x="835" y="1173" text-anchor="middle" class="label" font-size="10" fill="#ff4d4d">Metadata only</text>

  <!-- Local deployment -->
  <rect x="375" y="1190" width="150" height="30" class="bg-card"/>
  <text x="450" y="1210" text-anchor="middle" class="label" font-size="11">python run.py — Local</text>
</svg>